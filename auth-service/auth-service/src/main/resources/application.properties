# Server Port (auth-service thường chạy port 8080 hoặc 8083 tùy bài)
server.port=8083

# Application Name
spring.application.name=auth-service

# Database Configuration (Thay tên database, username, password của bạn vào)
spring.datasource.url=jdbc:mysql://localhost:3306/crs_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Secret Key tùy chỉnh)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000